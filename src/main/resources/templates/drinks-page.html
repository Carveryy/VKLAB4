<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Облік напоїв</title>
    <link rel="stylesheet" th:href="@{/static/styles.css}">
</head>
<body>
<h2>Список напоїв</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Назва</th>
        <th>Тип</th>
        <th>Об'єм (л)</th>
        <th>Ціна (грн)</th>
        <th>Дії</th>
    </tr>
    <tr th:each="drink : ${drinks}">
        <td th:text="${drink.id}"></td>
        <td th:text="${drink.name}"></td>
        <td th:text="${drink.type}"></td>
        <td th:text="${drink.volume}"></td>
        <td th:text="${drink.price}"></td>
        <td>
            <a th:href="@{/drinks/edit/{id}(id=${drink.id})}">Редагувати</a> |
            <a th:href="@{/drinks/delete/{id}(id=${drink.id})}">Видалити</a>
        </td>
    </tr>
</table>

<hr>
<h3>Додати новий напій</h3>
<form th:action="@{/drinks/add}" th:object="${newDrink}" method="post">
    <input type="text" th:field="*{name}" placeholder="Назва" required>
    <input type="text" th:field="*{type}" placeholder="Тип" required>
    <input type="number" step="0.01" th:field="*{volume}" placeholder="Об'єм" required>
    <input type="number" step="0.01" th:field="*{price}" placeholder="Ціна" required>
    <button type="submit">Додати</button>
</form>
</body>
</html>
