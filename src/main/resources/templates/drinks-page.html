<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Облік напоїв (Лабораторна 4)</title>
    <link rel="stylesheet" th:href="@{/css/styles.css(v=2)}">
</head>
<body>

<h2>Список напоїв</h2>
<p>Знайдено записів: <span th:text="${#lists.size(drinks)}"></span></p>

<table>
    <tr>
        <th>ID</th>
        <th>Назва</th>
        <th>Тип</th>
        <th>Об'єм (л)</th>
        <th>Ціна (грн)</th>
        <th>Дії</th>
    </tr>
    <tr th:if="${#lists.isEmpty(drinks)}">
        <td colspan="6">Нічого не знайдено</td>
    </tr>
    <tr th:each="drink : ${drinks}">
        <td th:text="${drink.id}"></td>
        <td th:text="${drink.name}"></td>
        <td th:text="${drink.type}"></td>
        <td th:text="${drink.volume}"></td>
        <td th:text="${drink.price}"></td>
        <td>
            <div class="actions">
                <a th:href="@{/drinks/edit/{id}(id=${drink.id})}">Редагувати</a>
                <form class="inline" th:action="@{/drinks/delete/{id}(id=${drink.id})}" method="post"
                      onsubmit="return confirm('Ви дійсно хочете видалити цей напій? Ця дія незворотна.');">
                    <button type="submit" class="btn-link">Видалити</button>
                </form>
            </div>
        </td>
    </tr>
</table>

<hr>

<!-- Нижній ряд: додавання (ліворуч) і пошук (праворуч) -->
<div class="bottom-row">

    <div class="panel">
        <h2>Додати новий напій</h2>
        <form th:action="@{/drinks/add}" th:object="${newDrink}" method="post"
              onsubmit="return confirm('Додати новий напій?');">
            <div>
                <label>Назва:</label>
                <input type="text" th:field="*{name}" required>
            </div>
            <div>
                <label>Тип (категорія):</label>
                <input type="text" th:field="*{type}" required>
            </div>
            <div>
                <label>Об'єм (л):</label>
                <input type="number" step="0.01" th:field="*{volume}" required>
            </div>
            <div>
                <label>Ціна (грн):</label>
                <input type="number" step="0.01" th:field="*{price}" required>
            </div>
            <button type="submit">Додати напій</button>
        </form>
    </div>

    <div class="panel">
        <h2>Пошук і фільтрація</h2>
        <form th:action="@{/drinks}" method="get">
            <div>
                <label>Назва містить:</label>
                <input type="text" name="name" th:value="${filterName}">
            </div>
            <div>
                <label>Тип містить:</label>
                <input type="text" name="type" th:value="${filterType}">
            </div>
            <div>
                <label>Об'єм від (л):</label>
                <input type="number" step="0.01" name="minVolume" th:value="${filterMinVolume}">
            </div>
            <div>
                <label>Об'єм до (л):</label>
                <input type="number" step="0.01" name="maxVolume" th:value="${filterMaxVolume}">
            </div>
            <div>
                <label>Ціна від (грн):</label>
                <input type="number" step="0.01" name="minPrice" th:value="${filterMinPrice}">
            </div>
            <div>
                <label>Ціна до (грн):</label>
                <input type="number" step="0.01" name="maxPrice" th:value="${filterMaxPrice}">
            </div>
            <div class="form-buttons">
                <button type="submit">Знайти</button>
                <a class="btn btn-secondary" th:href="@{/drinks}">Скинути</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
